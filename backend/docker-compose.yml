services:
  db:
    image: postgres:16
    container_name: peblo-postgres
    environment:
      POSTGRES_DB: peblo
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: